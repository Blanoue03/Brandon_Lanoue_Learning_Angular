
@for (game of gameList; track game.id) {

  <div class="gameReviewContainer" [class]="{bad: game.rating < 5, good: game.rating > 5}"  >
    <a [routerLink]="['/Games', game.id]" routerLinkActive="active"><img src ="{{game.cover}}"></a>
    <h3>{{game.title | titlecase}}</h3>
    <p>Genre: {{game.genre}}</p>
    <p>Creator: {{game.creator}}</p>
    <p>Released: {{game.yearReleased | date:'longDate'}}</p>
    <p>Rating: {{game | rating}} </p>
    <p>Cost: {{game.cost | currency:'CAD':"symbol-narrow"}} </p>
    <button [routerLink]="['/Modify-Review', game.id]" [appHoverHighlight]="'green'">Edit</button>
    <button (click)="delete(game.id)" [appHoverHighlight]="'green'">Delete</button>
  </div>


}
