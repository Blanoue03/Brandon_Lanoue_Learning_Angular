@if (game)
{

    <div class="gameReviewContainer" [class]="{bad: game.rating < 5, good: game.rating > 5}"  >
      <a [routerLink]="['/Games', game.id]" routerLinkActive="active"><img src ="{{game.cover}}"></a>
      <h3>{{game.title | titlecase}}</h3>
      <mat-list class="list">
        <mat-list-item class="listItem">Genre: {{game.genre}}</mat-list-item>
        <mat-list-item class="listItem">Creator: {{game.creator}}</mat-list-item>
        <mat-list-item class="listItem">Released: {{game.yearReleased | date:'longDate'}}</mat-list-item>
        <mat-list-item class="listItem">Rating: {{game | rating}}</mat-list-item>
        <mat-list-item class="listItem"><div><mat-progress-bar class="ratingBar" mode="determinate" value="{{game.rating*10}}"></mat-progress-bar></div></mat-list-item>
        <mat-list-item class="listItem">Cost: {{game.cost | currency:'CAD':"symbol-narrow"}} </mat-list-item>
      </mat-list>
      <button matButton="elevated" [routerLink]="['/Modify-Review', game.id]" [appHoverHighlight]="'green'">Edit</button>
      <button matButton="elevated" (click)="delete()" [appHoverHighlight]="'green'">Delete</button>
    </div>
}
